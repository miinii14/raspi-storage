events {}

http {
    server {
        listen 443 ssl;
        server_name raspi-storage;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        error_page 495 = @cert_invalid;
        error_page 496 = @cert_missing;
        error_page 497 = @https_required;


        location @cert_invalid {
            default_type application/problem+json;
            return 403 '{"title":"Forbidden","status":403,"detail":"Client certificate is invalid or expired","code":"cert_invalid","traceId":"$request_id"}';
        }

        location @cert_missing {
            default_type application/problem+json;
            return 403 '{"title":"Forbidden","status":403,"detail":"A client certificate is required","code":"cert_missing","traceId":"$request_id"}';
        }

        location @https_required {
            default_type application/problem+json;
            return 400 '{"title":"Bad Request","status":400,"detail":"Use HTTPS","code":"https_required","traceId":"$request_id"}';
        }

        location / {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
            client_max_body_size 1G;
            proxy_request_buffering off;
            proxy_http_version 1.1;
        }
    }
}
